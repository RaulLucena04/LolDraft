[workspace]
resolver = "2"
members = [
    "crates/loldraft-domain",
    "crates/loldraft-engine",
    "crates/loldraft-data",
    "crates/loldraft-sources",
    "crates/loldraft-curation",
    "src-tauri",
]

[workspace.package]
version = "0.1.4"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/RaulLucena04/LolDraft"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.42", features = ["bundled"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "webpki-roots"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
base64 = "0.22"
loldraft-domain = { path = "crates/loldraft-domain" }
loldraft-engine = { path = "crates/loldraft-engine" }
loldraft-data = { path = "crates/loldraft-data" }
loldraft-sources = { path = "crates/loldraft-sources" }
loldraft-curation = { path = "crates/loldraft-curation" }

[profile.dev]
opt-level = 0

[profile.release]
lto = "thin"
codegen-units = 1
